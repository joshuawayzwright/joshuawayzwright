[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "0.6.0"
description = "AI engineering assistant that pulls and works with code from GitHub, built on the Claude API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=2.8.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=2", "pillow>=10"]
mcp = ["mcp>=1.2"]
screen = ["mss>=9", "pillow>=10"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4.6", "numpy>=1.24", "pyttsx3>=2.90", "openwakeword==0.4.0"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools]
packages = ["jarvis"]
[tool.pytest.ini_options]
pythonpath = ["tests"]
