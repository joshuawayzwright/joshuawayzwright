[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "0.1.0"
description = "AI engineering assistant that pulls and works with code from GitHub, built on the Claude API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=2.8.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools]
packages = ["jarvis"]
